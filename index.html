<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초록 보카</title>
<meta name="description" content="TOEFL 초록 단어책을 하루 10개씩 카드와 퀴즈로 외우는 간격 반복 단어장">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="초록 보카">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400..700&display=swap">
<style>
:root{
  --bg:#f1f4ef; --surface:#ffffff; --surface-2:#e8eee6; --surface-3:#dde5da; --ink:#15231a; --ink-2:#48584d; --ink-3:#78877d; --line:#d7dfd5; --line-2:#c4cfc1;
  --accent:#1b7a4b; --accent-strong:#135b37; --accent-deep:#0e4a2c; --accent-ink:#ffffff; --accent-soft:#dbeee2; --accent-mid:#9fcfb2;
  --dont:#c9472f; --dont-deep:#96301d; --dont-soft:#fae3dd; --dont-ink:#ffffff;
  --gold:#e9a310; --gold-deep:#b57a00; --gold-soft:#fdf0cf; --flame1:#ffb020; --flame2:#ff5a1f; --blue:#2f6fd6; --blue-soft:#e1ebfb;
  --hole:#e3e9e1;
  --card-shadow:0 1px 2px rgb(21 35 26 / .07),0 22px 40px -22px rgb(21 35 26 / .34);
  --soft-shadow:0 1px 2px rgb(21 35 26 / .05),0 10px 24px -18px rgb(21 35 26 / .24);
  --f-serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:20px; --tabs-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1411; --surface:#161f1a; --surface-2:#1f2a23; --surface-3:#28352d; --ink:#e5eee8; --ink-2:#a7b6ac; --ink-3:#7a897f; --line:#2a362f; --line-2:#36453b;
    --accent:#3fb37b; --accent-strong:#5fd197; --accent-deep:#1f6a45; --accent-ink:#04200f; --accent-soft:#16301f; --accent-mid:#2c6446;
    --dont:#ef6f57; --dont-deep:#9e3a28; --dont-soft:#3a1c16; --dont-ink:#2a0c06;
    --gold:#f0b333; --gold-deep:#a8740a; --gold-soft:#3a2d10; --blue:#6f9ff0; --blue-soft:#18243a;
    --hole:#0e1411;
    --card-shadow:0 1px 2px rgb(0 0 0 / .45),0 22px 40px -22px rgb(0 0 0 / .8);
    --soft-shadow:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -18px rgb(0 0 0 / .7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1411; --surface:#161f1a; --surface-2:#1f2a23; --surface-3:#28352d; --ink:#e5eee8; --ink-2:#a7b6ac; --ink-3:#7a897f; --line:#2a362f; --line-2:#36453b;
  --accent:#3fb37b; --accent-strong:#5fd197; --accent-deep:#1f6a45; --accent-ink:#04200f; --accent-soft:#16301f; --accent-mid:#2c6446;
  --dont:#ef6f57; --dont-deep:#9e3a28; --dont-soft:#3a1c16; --dont-ink:#2a0c06;
  --gold:#f0b333; --gold-deep:#a8740a; --gold-soft:#3a2d10; --blue:#6f9ff0; --blue-soft:#18243a;
  --hole:#0e1411;
  --card-shadow:0 1px 2px rgb(0 0 0 / .45),0 22px 40px -22px rgb(0 0 0 / .8);
  --soft-shadow:0 1px 2px rgb(0 0 0 / .35),0 10px 24px -18px rgb(0 0 0 / .7);
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
svg{display:block}
.mono{font-family:var(--f-mono)}
.serif{font-family:var(--f-serif)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* layout */
.screen{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px))}
.screen.tabbed{padding-bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.flow .wrap{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 36px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.topbar h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:23px;height:23px}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--soft-shadow)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec span,.sec button{font-size:13px;color:var(--ink-3)}
.muted{color:var(--ink-3)}

/* chunky buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:0 20px;border-radius:16px;font-weight:700;font-size:16.5px;letter-spacing:.01em;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);transition:transform .07s,box-shadow .07s,filter .15s;width:100%}
.btn svg{width:21px;height:21px}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:hover:not(:disabled){filter:brightness(1.04)}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.alt:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.btn.bad{background:var(--dont);color:var(--dont-ink);box-shadow:0 4px 0 var(--dont-deep)}
.btn.gold{background:var(--gold);color:#2b1c00;box-shadow:0 4px 0 var(--gold-deep)}
.btn.sm{min-height:42px;font-size:14.5px;border-radius:13px;padding:0 14px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabs-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.4}

/* home */
.streakchip{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;color:var(--ink-2);padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--soft-shadow)}
.streakchip svg{width:20px;height:20px}
.streakchip.on{color:#c2410c}
.hero{padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero-top{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--f-serif);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums lining-nums}
.ring .v small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}
.hero h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.hero p{font-size:14px;color:var(--ink-2)}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{background:var(--surface-2);border-radius:14px;padding:11px 14px 10px}
.count b{display:block;font-family:var(--f-serif);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}
.count span{font-size:13px;color:var(--ink-2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 10px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.wk i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.wk i svg{width:18px;height:18px;opacity:0}
.wk.part i{border-color:var(--gold);background:var(--gold-soft)}
.wk.done i{border-color:transparent;background:linear-gradient(160deg,var(--flame1),var(--flame2))}
.wk.done i svg{opacity:1}
.wk.today span{color:var(--ink);font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qk{display:flex;align-items:center;gap:11px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--soft-shadow);text-align:left;transition:transform .1s}
.qk:active{transform:scale(.98)}
.qk i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.qk i svg{width:22px;height:22px}
.qk b{display:block;font-size:14.5px;font-weight:700}
.qk small{display:block;font-size:12.5px;color:var(--ink-3)}
.i-green{background:var(--accent-soft);color:var(--accent-strong)}
.i-red{background:var(--dont-soft);color:var(--dont)}
.i-gold{background:var(--gold-soft);color:var(--gold-deep)}
.i-blue{background:var(--blue-soft);color:var(--blue)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.dn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 6px;border-radius:14px;transition:transform .1s}
.dn:active{transform:scale(.95)}
.dn .ringsm{position:relative;width:52px;height:52px}
.dn .ringsm svg{width:52px;height:52px;transform:rotate(-90deg)}
.dn .ringsm b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:500}
.dn .ringsm.full b{color:var(--accent-ink)}
.dn small{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--gold-soft);color:var(--ink);font-size:13.5px;line-height:1.5}
.banner svg{width:22px;height:22px;flex:none;color:var(--gold-deep)}
.banner.green{background:var(--accent-soft)}
.banner.green svg{color:var(--accent-strong)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;min-height:50px}
.qbar{flex:1;height:14px;border-radius:14px;background:var(--surface-3);overflow:hidden;position:relative}
.qbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:14px;transition:width .35s cubic-bezier(.3,.9,.3,1)}
.qbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:3px;background:rgb(255 255 255 / .35)}
.combo{display:flex;align-items:center;gap:3px;font-weight:800;font-size:15px;color:#d9480f;font-variant-numeric:tabular-nums;min-width:44px;justify-content:flex-end}
.combo svg{width:20px;height:20px}
.combo.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.qbody{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:10px}
.qtag{align-self:flex-start;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong)}
.qtag.rev{background:var(--blue-soft);color:var(--blue)}
.qtag.again{background:var(--dont-soft);color:var(--dont)}
.qtag.test{background:var(--gold-soft);color:var(--gold-deep)}
.qprompt{font-size:19px;font-weight:700;letter-spacing:-.01em}
.qword{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qword .w{font-family:var(--f-serif);font-size:clamp(34px,10vw,46px);font-weight:600;line-height:1.1;letter-spacing:-.015em;overflow-wrap:anywhere}
.qword .w.long{font-size:clamp(26px,7.4vw,36px)}
.say{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);flex:none;transition:transform .1s}
.say:active{transform:scale(.92)}
.say svg{width:23px;height:23px}
.say.big{width:96px;height:96px;border-radius:28px;box-shadow:0 5px 0 color-mix(in srgb,var(--blue) 45%,transparent)}
.say.big svg{width:48px;height:48px}
.say.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.qmean{font-size:clamp(22px,6.2vw,27px);font-weight:700;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.qhint{font-family:var(--f-serif);font-size:16.5px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:4px}
.opt{width:100%;text-align:left;padding:13px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);font-size:16.5px;line-height:1.35;display:flex;gap:12px;align-items:center;min-height:58px;transition:transform .07s,box-shadow .07s,background-color .15s,border-color .15s}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--ink-3);flex:none}
.opt.en{font-family:var(--f-serif);font-size:19px}
.opt.right{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 var(--accent)}
.opt.right .k{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.wrong{border-color:var(--dont);background:var(--dont-soft);box-shadow:0 3px 0 var(--dont);animation:shake .38s}
.opt.wrong .k{border-color:var(--dont);background:var(--dont);color:var(--dont-ink)}
.opt.dim{opacity:.55}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.spell{display:flex;flex-direction:column;gap:12px}
.spell input{width:100%;font-family:var(--f-serif);font-size:24px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);outline:none;box-shadow:0 3px 0 var(--line)}
.spell input:focus{border-color:var(--blue)}
.spell input.right{border-color:var(--accent);background:var(--accent-soft)}
.spell input.wrong{border-color:var(--dont);background:var(--dont-soft);animation:shake .38s}
.slots{font-family:var(--f-mono);font-size:15px;letter-spacing:.18em;color:var(--ink-3)}
.qfoot{position:sticky;bottom:0;padding-top:14px;padding-bottom:4px;background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* learn card + flashcards */
.lcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--card-shadow);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;position:relative}
.idx{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--ink-3)}
.hole{width:15px;height:15px;border-radius:50%;background:var(--hole);box-shadow:inset 0 1.5px 2.5px rgb(0 0 0 / .28);flex:none;margin-right:4px}
.lword{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--accent-soft)}
.lword .w{font-family:var(--f-serif);font-size:clamp(32px,9vw,42px);font-weight:600;line-height:1.1;letter-spacing:-.015em;overflow-wrap:anywhere}
.senses{display:flex;flex-direction:column;gap:13px}
.senses li{display:flex;gap:10px}
.senses .no{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600;padding-top:6px;width:14px;flex:none}
.ko{font-size:19px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.en{font-family:var(--f-serif);font-size:17px;color:var(--ink-2);line-height:1.4;margin-top:2px}
.syn{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);margin-right:7px;text-transform:uppercase;vertical-align:1px}
.note{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;line-height:1.5}
.note b{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);margin-bottom:2px}
.fixnote{font-size:12px;color:var(--ink-3)}
.stage{position:relative;height:min(56vh,470px);min-height:320px}
.deck{position:absolute;inset:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--soft-shadow)}
.deck.d1{transform:translateY(9px) scale(.965);opacity:.75}
.deck.d2{transform:translateY(18px) scale(.93);opacity:.45}
.drag{position:absolute;inset:0;touch-action:pan-y;perspective:1400px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.2,.75,.25,1);cursor:pointer;border-radius:var(--r);outline:none}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--card-shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;gap:10px;padding:18px 20px 20px;overflow:hidden}
.face.back{transform:rotateY(180deg);overflow-y:auto;overscroll-behavior:contain}
.face .say{position:absolute;top:12px;right:12px}
.face .fw{font-family:var(--f-serif);font-weight:600;font-size:clamp(36px,10.5vw,52px);letter-spacing:-.015em;line-height:1.08;text-align:center;margin:auto 0;text-wrap:balance;overflow-wrap:anywhere;padding-inline:6px}
.face .fw.long{font-size:clamp(28px,8vw,40px)}
.face .fk{margin:auto 0;display:flex;flex-direction:column;gap:12px;text-align:center}
.face .fk p{font-size:clamp(21px,6vw,27px);font-weight:700;line-height:1.35;text-wrap:balance}
.hint{text-align:center;font-size:13px;color:var(--ink-3)}

function flip() {
  const c = $('card'); if (!c || busy) return;
  flipped = !flipped;

  Sound.sfx('flip');

function flyOut(dir, done) {
  const d = $('drag');
  if (!d || reduced()) { done(); return; }
  busy = true;
  (dir > 0 ? $('stampK') : $('stampD')).style.opacity = 1;
  d.style.transition = 'transform .24s ease-in, opacity .24s ease-in';
  d.style.transform = `translateX(${dir * 125}%) rotate(${dir * 14}deg)`;

function bindDrag(onSwipe) {
  const el = $('drag');
  if (!el) return;
  el.addEventListener('pointerdown', ev => {
    if (busy || (ev.button && ev.button > 0) || ev.target.closest('[data-act]')) return;
    drag = { x: ev.clientX, y: ev.clientY, id: ev.pointerId, dx: 0, t: performance.now(), moved: false };
  });
  el.addEventListener('pointermove', ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
      drag.moved = true;
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    }
    drag.dx = dx;
    el.style.transition = 'none';
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    $('stampK').style.opacity = clamp(dx / 90, 0, 1);
    $('stampD').style.opacity = clamp(-dx / 90, 0, 1);

  const end = ev => {
    if (!drag || ev.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.moved) { if (ev.type === 'pointerup') flip(); return; }
    const v = Math.abs(d.dx) / Math.max(1, performance.now() - d.t);
    if (Math.abs(d.dx) > 90 || (Math.abs(d.dx) > 40 && v > 0.55)) onSwipe(d.dx > 0 ? 1 : -1);
    else { el.style.transition = 'transform .2s'; el.style.transform = ''; $('stampK').style.opacity = 0; $('stampD').style.opacity = 0; }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

function renderStats() {
  const T = today(), s = state, goal = s.settings.goal, streak = L.streak(s, T);

  const todayXp = (s.days[L.dayKey(T)] || {}).xp || 0;
  const weeks = 12, startT = T - (T + 4) % 7 - (weeks - 1) * 7;
  let heat = '';
  for (let t = startT; t < startT + weeks * 7; t++) {
    const d = s.days[L.dayKey(t)], xp = d ? d.xp || 0 : 0;
    const lvl = t > T ? '' : xp >= goal ? 'l3' : xp >= goal / 2 ? 'l2' : xp > 0 ? 'l1' : '';
    heat += `<i class="${lvl}${t === T ? ' today' : ''}" title="${L.dayKey(t)} · ${xp} XP" style="${t > T ? 'opacity:.35' : ''}"></i>`;
  }

async function backup() {
  const json = JSON.stringify({ app: 'chorok-voca-backup', v: 2, at: new Date().toISOString(), state });
  const name = 'chorok-voca-backup-' + L.dayKey(today()) + '.json';
  if (!PWA && window.claude && window.claude.use) {
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({ filename: name, data: json }); toast('백업 파일을 저장했어요'); return; } } catch (e) {}
  }
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '초록 보카 백업' }); toast('백업 파일을 만들었어요'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('백업 파일을 만들었어요');
}

let unlocking = false;
async function unlock() {
  if (unlocking) return;
  const code = ($('codeIn').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 8) { unlockMsg('8자리 코드를 입력해 주세요', true); return; }
  if (!window.crypto || !crypto.subtle) { unlockMsg('이 브라우저에서는 코드를 풀 수 없어요. 최신 Safari나 Chrome으로 열어 주세요.', true); return; }
  unlocking = true; $('unlockBtn').disabled = true;
  try {
    unlockMsg('코드 확인 중…'); unlockProg(0.05);
    const key = await Crypto.derive(code);
    const res = await fetch(CFG.data.words, { cache: 'no-cache' });
    if (!res.ok) throw new Error('net');
    let plain;
    try { plain = await Crypto.open(key, await res.arrayBuffer()); } catch (e) { unlockMsg('코드가 맞지 않아요. 다시 확인해 주세요.', true); unlockProg(null); return; }
    const data = JSON.parse(new TextDecoder().decode(plain));
    localStorage.setItem(K_WORDS, JSON.stringify({ v: data.v || 2, rev: data.rev || '', words: data.words }));
    localStorage.setItem(K_KEY, b64.enc(await crypto.subtle.exportKey('raw', key)));
    Crypto.key = key;
    const days = CFG.audio ? CFG.audio.days : [];
    let done = 0;
    unlockMsg(`발음 받는 중… 0/${days.length}`); unlockProg(0.1);
    const queue = days.slice();
    const store = 'caches' in window ? await caches.open('cv-data').catch(() => null) : null;   // the service worker may not control the page yet on the first launch
    const worker = async () => {
      while (queue.length) {
        const d = queue.shift(), url = new URL(Voice.url(d), location.href).href;
        try { if (store) { if (!(await store.match(url))) await store.add(url); } else await (await fetch(url)).arrayBuffer(); } catch (e) {}
        done++; unlockMsg(`발음 받는 중… ${done}/${days.length}`); unlockProg(0.1 + 0.9 * done / days.length);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    unlockMsg(`${fmt(data.words.length)}단어 준비 완료!`);
    await sleep(500);
    if (state) flush();
    Voice.packs.clear(); Voice.bufs.clear(); Voice.order = [];
    startApp(data.words);
  } catch (e) {
    unlockMsg('내려받지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', true); unlockProg(null);
  } finally { unlocking = false; const b = $('unlockBtn'); if (b) b.disabled = false; }
}

/* ---------- actions ---------- */
function toggleStar(id, el) {
  if (state.stars[id]) delete state.stars[id]; else { state.stars[id] = 1; Sound.sfx('star'); }
  save();
  for (const b of document.querySelectorAll(`[data-act="star"][data-id="${id}"]`)) { b.classList.toggle('on', !!state.stars[id]); b.setAttribute('aria-pressed', String(!!state.stars[id])); }
}
const ACT = {
  tab: el => { if (screen === 'quiz') return; Voice.stop(); go(el.dataset.tab); },
  settings: () => go('settings'),
  back: () => go(screen === 'day' ? (dayView && dayView.from === 'home' ? 'home' : 'words') : ['home', 'words', 'test', 'stats'].includes(prevScreen) ? prevScreen : tab),
  day: el => go('day', { t: 'day', d: Number(el.dataset.day), from: screen }),
  starList: () => go('day', { t: 'stars', from: screen }),
  wrongList: () => go('day', { t: 'wrong', from: screen }),
  say: el => { sayBtnFeedback(el); Voice.play(el.dataset.id); },
  star: el => toggleStar(el.dataset.id, el),
  lesson: () => startLesson(),
  lessonExtra: () => startLesson({ extra: state.settings.daily }),
  lessonMore: () => startLesson({ more: true }),
  next: () => nextLearn(),
  pick: el => pick(Number(el.dataset.i)),
  cont: () => cont(),
  quit: () => quitRun(),
  hint: () => hint(),
  spellGo: () => spellGo(),
  cardKnow: () => cardAnswer(true),
  cardDont: () => cardAnswer(false),
  sheet: el => closeSheet(el.dataset.v),
  obPick: el => { state.settings.daily = Number(el.dataset.v); for (const b of document.querySelectorAll('#obSeg button')) b.setAttribute('aria-pressed', String(b === el)); },
  autoToday: () => { const p = L.todayPlan(state, W, today()); const ids = (state.nt && state.nt.d === today() ? state.nt.ids : p.planned); startAuto(ids, '오늘의 단어', null); },
  listBrowse: () => startBrowse(listFor(dayView).map(e => e.id), dayView.t === 'day' ? 'Day ' + pad2(dayView.d) : dayView.t === 'stars' ? '즐겨찾기' : '오답노트', listKey(dayView)),
  listAuto: () => startAuto(listFor(dayView).map(e => e.id), dayView.t === 'day' ? 'Day ' + pad2(dayView.d) : dayView.t === 'stars' ? '즐겨찾기' : '오답노트', listKey(dayView)),
  listTest: () => {
    const ids = listFor(dayView).map(e => e.id), label = dayView.t === 'day' ? 'Day ' + pad2(dayView.d) : dayView.t === 'stars' ? '즐겨찾기' : '오답노트';
    startTest({ range: { t: 'ids', ids: L.shuffle(ids.slice()) }, qt: 'mix', count: 20, label });
  },
  browseIds: el => startBrowse(el.dataset.ids.split(','), el.dataset.label || '카드', null),
  browseClose: () => { Voice.stop(); const from = B && B.from; B = null; go(from === 'day' ? 'day' : TABBED.includes(from) ? from : 'home'); },
  browsePrev: () => browseMove(-1, false),
  browseNext: () => browseMove(1, false),
  browseShuffle: () => { B.shuffled = !B.shuffled; const cur = B.ids[B.i]; B.ids = B.shuffled ? L.shuffle(B.order.slice()) : B.order.slice(); B.i = Math.max(0, B.ids.indexOf(cur)); renderBrowse(0); toast(B.shuffled ? '카드를 섞었어요' : '원래 순서로 돌아왔어요'); },
  autoClose: () => { autoStop(); const from = A && A.from; A = null; go(from === 'day' ? 'day' : TABBED.includes(from) ? from : 'home'); },
  autoToggle: () => { if (A.playing) { autoStop(); renderAuto(); } else autoPlay(true); },
  autoPrev: () => { const was = A.playing; autoStop(); A.i = Math.max(0, A.i - 1); A.reveal = false; if (was) autoPlay(true); else { renderAuto(); Voice.play(A.ids[A.i]); } },
  autoNext: () => { const was = A.playing; autoStop(); A.i = Math.min(A.ids.length - 1, A.i + 1); A.reveal = false; if (was) autoPlay(true); else { renderAuto(); Voice.play(A.ids[A.i]); } },
  autoRepeat: el => { state.settings.repeat = Number(el.dataset.v); save(); for (const b of document.querySelectorAll('[data-act="autoRepeat"]')) b.setAttribute('aria-pressed', String(b === el)); },
  tbRange: el => { TB.range = el.dataset.v; state.tb = TB; save(); renderTest(); },
  tbDay: el => { const d = Number(el.dataset.v); TB.days = TB.days.includes(d) ? TB.days.filter(x => x !== d) : TB.days.concat(d); state.tb = TB; save(); renderTest(); },
  tbAll: () => { TB.days = W.days.slice(); state.tb = TB; save(); renderTest(); },
  tbNone: () => { TB.days = []; state.tb = TB; save(); renderTest(); },
  tbQt: el => { TB.qt = el.dataset.v; state.tb = TB; save(); renderTest(); },
  tbCount: el => { TB.count = Number(el.dataset.v); state.tb = TB; save(); renderTest(); },
  testStart: () => { const r = TB.range === 'days' ? { t: 'days', days: TB.days } : { t: TB.range }; startTest({ range: r, qt: TB.qt, count: TB.count, label: tbLabel() }); },
  testResume: () => { if (state.test) run(state.test); },
  retryWrong: el => startTest({ range: { t: 'ids', ids: L.shuffle(el.dataset.ids.split(',')) }, qt: 'mix', count: 0, label: '틀린 문제 다시' }),
  set: el => {
    const k = el.dataset.k, raw = el.dataset.v, v = /^\d+$/.test(raw) ? Number(raw) : raw;
    state.settings[k] = v;
    if (k === 'daily') L.refreshPlan(state, W, today());
    if (k === 'goal') { const ds = state.days[L.dayKey(today())]; if (ds && ds.xp >= v) ds.met = true; }
    if (k === 'theme') applyTheme();
    save(); renderSettings();
  },
  soundTest: () => { Sound.unlock(); Sound.sfx('right'); setTimeout(() => Voice.play(W.words[0].id), 450); },
  backup: () => backup(),
  restore: () => pickFile('restore'),
  reset: async () => {
    const ok = await confirmSheet('정말 초기화할까요?', '진도, 연속 기록, 시험 기록, 즐겨찾기가 모두 지워지고 되돌릴 수 없어요.', '모두 지우기', '취소', true);
    if (!ok) return;
    const keep = Object.assign({}, state.settings);
    state = L.sanitize({ settings: keep, onboarded: true }, W);
    save(); flush(); toast('기록을 초기화했어요'); go('home');
  },
  unlock: () => unlock(),
  codeAgain: () => { renderUnlock(); show('unlock'); },
  wordsFile: () => pickFile('words'),
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'BUTTON') el.blur();
  fn(el, ev);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.set) return;
  const k = el.dataset.set;
  state.settings[k] = el.type === 'checkbox' ? el.checked : /^\d+$/.test(el.value) ? Number(el.value) : el.value;
  if (k === 'start') L.refreshPlan(state, W, today());
  if (k === 'silent') Sound.session();
  save();
});
document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true, passive: true });
document.addEventListener('keydown', ev => {
  if (!$('sheet').hidden) { if (ev.key === 'Escape') closeSheet(null); return; }
  const inField = ev.target.closest && ev.target.closest('input,select,textarea');
  if (screen === 'quiz' && Q) {
    if (ev.repeat && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); return; }
    const st = curStep(), fbOpen = $('fb').classList.contains('show');
    if (inField) { if (ev.key === 'Enter' && ev.target.id === 'spellIn') { ev.preventDefault(); fbOpen ? cont() : spellGo(); } return; }
    if (fbOpen) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); cont(); } return; }
    if (!st) return;
    if (st.k === 'learn') { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); nextLearn(); } }
    else if (st.q && st.q.t === 'card') {
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(); }
      else if (ev.key === 'ArrowRight') cardAnswer(true);
      else if (ev.key === 'ArrowLeft') cardAnswer(false);
    } else if (st.q && st.q.opts && /^[1-4]$/.test(ev.key)) pick(Number(ev.key) - 1);
    if ((ev.key === 's' || ev.key === 'S') && st.q && st.q.t !== 'mcq-en' && st.q.t !== 'spell') Voice.play(st.id);
    if (ev.key === 'Escape') quitRun();
    return;
  }
  if (inField) return;
  if (screen === 'browse' && B) {
    if (ev.key === 'ArrowRight') browseMove(1, false);
    else if (ev.key === 'ArrowLeft') browseMove(-1, false);
    else if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); flip(); }
    else if (ev.key === 's' || ev.key === 'S') Voice.play(B.ids[B.i]);
    else if (ev.key === 'Escape') ACT.browseClose();
  } else if (screen === 'auto' && A) {
    if (ev.key === ' ') { ev.preventDefault(); ACT.autoToggle(); }
    else if (ev.key === 'ArrowRight') ACT.autoNext();
    else if (ev.key === 'ArrowLeft') ACT.autoPrev();
    else if (ev.key === 'Escape') ACT.autoClose();
  }
});

/* ---------- boot ---------- */
function paintTabs() {
  const t = [['home', I.home, '홈'], ['words', I.book, '단어장'], ['test', I.quiz, '테스트'], ['stats', I.chart, '기록']];
  for (const [k, ic, label] of t) $('tab-' + k).innerHTML = ic + `<span>${label}</span>`;
  document.querySelector('[data-act="quit"]').innerHTML = I.close;
}
async function refreshWords() {   // a newer word list was published: swap it in quietly
  try {
    const res = await fetch(CFG.data.words, { cache: 'no-cache' });
    if (!res.ok) return;
    const data = JSON.parse(new TextDecoder().decode(await Crypto.open(await Crypto.stored(), await res.arrayBuffer())));
    if (!Array.isArray(data.words) || !data.words.length || data.rev !== CFG.data.rev) return;   // an older cached copy: try again next launch
    localStorage.setItem(K_WORDS, JSON.stringify({ v: data.v || 2, rev: data.rev, words: data.words }));
    if (screen === 'quiz' || screen === 'browse' || screen === 'auto') return;   // takes effect on the next launch
    W = L.prepare(data.words);
    state = L.sanitize(state, W);
    if (screen === 'home') renderHome();
  } catch (e) {}
}
function storedRev() { try { return (JSON.parse(localStorage.getItem(K_WORDS) || '{}') || {}).rev || ''; } catch (e) { return ''; } }
function startApp(rows) {
  W = L.prepare(rows);
  state = L.sanitize(Local.read(), W);
  syncedAt = state.at || 0;
  settleSessions();
  if (state.lesson && !sessionActive(state.lesson, today())) state.lesson = null;
  applyTheme();
  go('home');
  if (PWA && CFG.data && CFG.data.rev && storedRev() !== CFG.data.rev && localStorage.getItem(K_KEY)) refreshWords();
  if (!PWA) {
    Cloud.connect().then(cloud => {
      if (!Cloud.ready) return;
      state = L.sanitize(mergeStates(state, cloud ? L.sanitize(cloud, W) : null), W);
      Local.write(state);
      Cloud.flush();
      if (screen === 'home') renderHome(); else if (screen === 'settings') renderSettings();
    }).catch(e => console.warn('[초록 보카] 계정 저장소 연결 실패, 이 브라우저에 저장해요', e));
  }
}
function boot() {
  paintTabs();
  if (PWA && 'serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  }
  const rows = storedRows();
  if (rows) { startApp(rows); return; }
  if (!PWA) { $('s-boot').innerHTML = '<div class="wrap unlock"><p class="muted" style="text-align:center">단어 데이터를 찾지 못했어요.</p></div>'; return; }
  renderUnlock();
  show('unlock');
}
boot();
})();
